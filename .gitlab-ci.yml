stages:
  - build
  - deploy

variables:
  APP_NAME: skincarenepal
  APP_DIR: /var/www/careandclean/skincarenepal
  NODE_ENV: production

build:
  stage: build
  tags: [vps, production]
  only: [main]
  script:
    - echo "🔨 Building application..."
    - npm ci
    - npx prisma generate
    - npm run build
  artifacts:
    paths:
      - .next
      - node_modules
      - prisma
    expire_in: 30 min

deploy:
  stage: deploy
  tags: [vps, production]
  only: [main]
  script:
    - echo "🚀 Deploying application..."

    # Sync build to live directory
    - rsync -a --delete .next node_modules prisma $APP_DIR/

    # Restore env
    - cp /var/www/careandclean/env/.env $APP_DIR/.env

    # DB update
    - cd $APP_DIR
    - npx prisma db push --skip-generate

    # Hard reset PM2
    - pm2 stop $APP_NAME || true
    - pm2 delete $APP_NAME || true
    - fuser -k 3000/tcp || true
    - pm2 start npm --name $APP_NAME -- start
    - pm2 save

    # Health check
    - sleep 5
    - curl -f http://localhost:3000

environment:
  name: production
  url: https://careandcleannp.com
